<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenPaw</title>
  <!--
    Native splash window.

    Deliberately self-contained: no scripts beyond the version line, no Tauri
    API calls, no network. The desktop capability is scoped to the "main"
    window, so this one has no permissions — and it has to render before the Go
    sidecar is even listening, so it cannot fetch anything anyway. The version
    arrives via an initialization script injected by main.rs.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      opacity: 1;
      transition: opacity 420ms ease, transform 420ms ease;
    }
    body.leaving .stage {
      opacity: 0;
      transform: scale(0.96);
    }

    .bg {
      position: absolute;
      inset: 0;
      background-image: url("splash/bg-8.webp");
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: scale(1.08);
      animation: bgIn 1100ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Keeps the wordmark legible whatever the background art is doing. */
    .scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 90% at 50% 8%, rgba(10, 10, 10, 0.55) 0%, rgba(10, 10, 10, 0.86) 70%),
        linear-gradient(180deg, rgba(10, 10, 10, 0.35) 0%, rgba(10, 10, 10, 0.75) 100%);
    }

    .glow {
      position: absolute;
      left: 50%;
      top: 32%;
      width: 300px;
      height: 300px;
      margin: -150px 0 0 -150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.30) 0%, rgba(236, 72, 153, 0) 68%);
      opacity: 0;
      animation: glowIn 1400ms ease-out 320ms forwards;
    }

    .logo {
      position: absolute;
      left: 50%;
      top: 24%;
      width: 62%;
      max-width: 300px;
      transform: translate(-50%, -220%);
      opacity: 0;
      animation: logoDrop 900ms cubic-bezier(0.34, 1.4, 0.5, 1) 260ms forwards;
    }

    /* The art is already composed as a cat peeking over an edge, so sliding it
       up from the bottom lands it exactly as drawn. */
    .cat {
      position: absolute;
      left: 50%;
      bottom: -4px;
      width: 74%;
      max-width: 340px;
      transform: translate(-50%, 105%);
      opacity: 0;
      animation: catPop 820ms cubic-bezier(0.28, 1.5, 0.45, 1) 760ms forwards;
    }

    .version {
      position: absolute;
      right: 14px;
      bottom: 11px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.42);
      opacity: 0;
      animation: fadeUp 700ms ease-out 1200ms forwards;
    }

    @keyframes bgIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes glowIn {
      to { opacity: 1; }
    }
    @keyframes logoDrop {
      from { transform: translate(-50%, -220%); opacity: 0; }
      to   { transform: translate(-50%, -50%);  opacity: 1; }
    }
    @keyframes catPop {
      from { transform: translate(-50%, 105%); opacity: 0; }
      60%  { transform: translate(-50%, -6%);  opacity: 1; }
      to   { transform: translate(-50%, 0);    opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg, .glow, .logo, .cat, .version {
        animation: none;
        opacity: 1;
        transform: none;
      }
      .logo { transform: translate(-50%, -50%); }
      .cat  { transform: translateX(-50%); }
      .stage { transition: opacity 160ms ease; }
      body.leaving .stage { transform: none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg"></div>
    <div class="scrim"></div>
    <div class="glow"></div>
    <img class="logo" src="splash/logo-transparent.png" alt="" />
    <img class="cat" src="splash/cat-toolbar.webp" alt="" />
    <div class="version" id="version"></div>
  </div>
  <script>
    // Injected by main.rs before this document loads. Absent in a plain browser,
    // in which case the slot just stays empty rather than showing "vundefined".
    var v = window.__OPENPAW_VERSION__;
    if (v) document.getElementById('version').textContent = 'v' + v;
  </script>
</body>
</html>
